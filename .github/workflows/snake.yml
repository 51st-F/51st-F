name: Generate snake & market report

on:
  schedule:
    # 台灣時間 16:30，三大法人資料也已公布
    - cron: "30 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 要在 snk 之前跑：snk 以 root 身分建立 dist/，之後一般使用者就寫不進去
      - name: Generate market report
        continue-on-error: true
        run: |
          mkdir -p dist
          python3 scripts/market_report.py dist

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
